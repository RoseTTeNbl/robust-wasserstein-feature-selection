[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robusthw"
version = "0.6.0"
description = "Full inner solves with uncertainty-guided robust feature selection"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "scipy>=1.15"]

[project.optional-dependencies]
logistic = ["cvxpy>=1.6", "clarabel>=0.10"]
experiments = ["scikit-learn>=1.6", "matplotlib>=3.10", "threadpoolctl>=3.5"]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
robusthw = "robusthw.cli:main"

[tool.setuptools.packages.find]
where = ["code"]
include = ["robusthw*"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["robusthw"]
