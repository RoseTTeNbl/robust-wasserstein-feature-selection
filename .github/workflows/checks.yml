name: Checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked --extra experiments --extra dev
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
