[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "robusthw"
version = "1.0.0"
description = "Wasserstein robust coordinate selection and a reproducible experiment protocol"
requires-python = ">=3.12"
dependencies = ["numpy>=2.2", "scipy>=1.15"]

[project.optional-dependencies]
experiments = ["scikit-learn>=1.6", "matplotlib>=3.10", "threadpoolctl>=3.5"]
dev = ["pytest>=8", "ruff>=0.12"]

[project.scripts]
robusthw = "robusthw.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["robusthw*"]

[tool.setuptools.data-files]
"share/robusthw/configs" = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["robusthw"]
